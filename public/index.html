<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeiterfassung & Abwesenheitsverwaltung</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--surface:#fff;--surface2:#f8f9fa;
  --border:#e2e4e7;--border2:#c8ccd2;
  --text:#1a1d23;--text2:#5a6070;--text3:#9aa0ac;
  --accent:#2563eb;--accent-bg:#eff4ff;--accent-text:#1d4ed8;
  --success:#16a34a;--success-bg:#f0fdf4;--success-border:#bbf7d0;
  --danger:#dc2626;--danger-bg:#fef2f2;--danger-border:#fecaca;
  --warn:#d97706;--warn-bg:#fffbeb;--warn-border:#fde68a;
  --purple:#7c3aed;--purple-bg:#f5f3ff;--purple-border:#ddd6fe;
  --orange:#ea580c;--orange-bg:#fff7ed;--orange-border:#fed7aa;
  --teal:#0d9488;--teal-bg:#f0fdfa;--teal-border:#99f6e4;
  --radius:6px;--sidebar:210px
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
#app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:15px;font-weight:600;color:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:10px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);padding:8px 0;overflow-y:auto;flex-shrink:0}
.main{flex:1;overflow-y:auto;padding:20px}
.sb-section{padding:6px 14px 3px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-top:6px}
.sb-btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 14px;font-size:13px;border:none;background:none;cursor:pointer;color:var(--text2);text-align:left}
.sb-btn:hover{background:var(--bg);color:var(--text)}
.sb-btn.active{background:var(--accent-bg);color:var(--accent-text);font-weight:500}
.badge{margin-left:auto;font-size:10px;background:var(--danger);color:#fff;padding:1px 5px;border-radius:8px;font-weight:600}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],input[type=color],select{padding:6px 8px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-primary:hover{background:#1d4ed8}
.btn-sm{padding:3px 8px;font-size:12px}
.btn-success{background:var(--success-bg);color:var(--success);border-color:var(--success-border)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.stat-lbl{font-size:11px;color:var(--text3);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat-sub{font-size:11px;color:var(--text3);margin-top:3px}
.pos{color:var(--success)}.neg{color:var(--danger)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:7px 10px;font-size:11px;font-weight:600;color:var(--text3);border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
.pill{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500}

.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.cal-nav h2{font-size:16px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.cal-head{text-align:center;font-size:11px;font-weight:600;color:var(--text3);padding:4px 0}
.cal-day{border:1px solid var(--border);border-radius:6px;padding:6px;min-height:72px;cursor:pointer;transition:box-shadow .15s;background:var(--surface)}
.cal-day:hover{box-shadow:0 0 0 2px var(--accent)}
.cal-day.today{border-color:var(--accent);border-width:2px}
.cal-day.empty{background:var(--bg);border-color:transparent;cursor:default;min-height:72px}
.cal-day.empty:hover{box-shadow:none}
.cal-dn{font-size:12px;font-weight:600;margin-bottom:4px;color:var(--text2)}
.cal-day.today .cal-dn{color:var(--accent)}
.cal-tag{font-size:10px;font-weight:600;padding:2px 5px;border-radius:4px;display:inline-block;margin-bottom:2px}
.cal-time{font-size:10px;color:var(--text3);line-height:1.4}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text2);margin-bottom:12px}
.cal-legend span{display:flex;align-items:center;gap:4px}
.leg-dot{width:10px;height:10px;border-radius:3px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border-radius:10px;padding:24px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.form-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.form-lbl{font-size:13px;color:var(--text2);min-width:140px}
.form-inp{flex:1;max-width:280px}

.ma-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ma-chip{padding:4px 12px;border:1px solid var(--border2);border-radius:20px;font-size:12px;cursor:pointer;background:var(--surface);color:var(--text2)}
.ma-chip.act{background:var(--accent);color:#fff;border-color:var(--accent)}

.page-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.page-hd h1{font-size:16px;font-weight:600}
.sep{height:1px;background:var(--border);margin:16px 0}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:12px}
.alert-info{background:var(--accent-bg);color:var(--accent-text);border:1px solid #bfdbfe}

.tag-custom{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="logo">⏱ <span id="firma-name">Zeiterfassung Admin System</span></div>
    <div class="topbar-right">
      <span class="live-dot" title="Live"></span>
      <span style="font-size:12px;color:var(--text3)">Admin Benutzer</span>
      <button class="btn btn-sm" onclick="alert('Abgemeldet')">Abmelden</button>
    </div>
  </div>
  <div class="body">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="main"></div>
  </div>
</div>

<div class="modal-bg" id="modal-bg" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const pad=n=>String(n).padStart(2,'0');
const fmtH=h=>{if(h===null||h===undefined)return'—';const neg=h<0;h=Math.abs(h);const hi=Math.floor(h),mi=Math.round((h-hi)*60);return(neg?'-':'')+hi+'h '+pad(mi)+'m';};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Global State
let page = 'kalender';
let calMonat = '2026-08';
let adminSelMa = 'm1';

// Dynamic Absence Types
let abwesenheitstypen = [
  { id: 'krank', name: 'Krankheit', emoji: '🏥', color: '#dc2626', bg: '#fef2f2', border: '#fecaca', isArbeitszeit: false, isPreset: true },
  { id: 'urlaub', name: 'Urlaub', emoji: '🏖️', color: '#7c3aed', bg: '#f5f3ff', border: '#ddd6fe', isArbeitszeit: false, isPreset: true },
  { id: 'geschaeftsreise', name: 'Geschäftsreise', emoji: '✈️', color: '#2563eb', bg: '#eff4ff', border: '#bfdbfe', isArbeitszeit: true, isPreset: true },
  { id: 'elternzeit', name: 'Elternzeit', emoji: '👶', color: '#d97706', bg: '#fffbeb', border: '#fde68a', isArbeitszeit: false, isPreset: true },
  { id: 'sonderurlaub', name: 'Sonderurlaub', emoji: '🎁', color: '#ea580c', bg: '#fff7ed', border: '#fed7aa', isArbeitszeit: false, isPreset: true },
  { id: 'homeoffice', name: 'Homeoffice', emoji: '🏠', color: '#0d9488', bg: '#f0fdfa', border: '#99f6e4', isArbeitszeit: true, isPreset: true }
];

// Employees
const users = [
  { id: 'm1', name: 'Max Mustermann', sollTag: 8 },
  { id: 'm2', name: 'Anna Schmidt', sollTag: 8 },
  { id: 'm3', name: 'Lukas Weber', sollTag: 7.5 }
];

// Calendar Entries Store
let calendarEntries = {
  'm1_2026-08-03': { type: 'homeoffice', kommentar: 'Mobiles Arbeiten', ein: '08:00', aus: '16:30', pauseMin: 30 },
  'm1_2026-08-04': { type: 'geschaeftsreise', kommentar: 'Kundenbesuch Frankfurt', ein: '08:00', aus: '16:30', pauseMin: 30 },
  'm1_2026-08-07': { type: 'krank', kommentar: 'AU vorgelegt' },
  'm1_2026-08-14': { type: 'sonderurlaub', kommentar: 'Hochzeit' },
  'm1_2026-08-17': { type: 'urlaub', kommentar: 'Sommerurlaub' }
};

function nav(p){ page=p; render(); }

function renderSidebar(){
  document.getElementById('sidebar').innerHTML = `
    <div class="sb-section">Verwaltung</div>
    <button class="sb-btn ${page==='kalender'?'active':''}" onclick="nav('kalender')">📅 Kalender & Abwesenheit</button>
    <button class="sb-btn ${page==='einstellungen'?'active':''}" onclick="nav('einstellungen')">⚙️ Abwesenheitstypen</button>
  `;
}

function render(){
  renderSidebar();
  const el = document.getElementById('main');
  if(page==='kalender') el.innerHTML = renderKalender();
  else if(page==='einstellungen') el.innerHTML = renderEinstellungen();
}

// ── Kalender View ──
function renderKalender(){
  const user = users.find(u=>u.id===adminSelMa);
  const [year, mon] = calMonat.split('-').map(Number);
  const firstDow = (new Date(year, mon-1, 1).getDay() + 6) % 7;
  const daysInMon = new Date(year, mon, 0).getDate();
  
  let cells = '';
  let istStundenGesamt = 0;
  let sollStundenGesamt = 0;
  let abwesenheitenCount = {};

  for(let i=0; i<firstDow; i++) cells += `<div class="cal-day empty"></div>`;
  
  for(let day=1; day<=daysInMon; day++){
    const ds = `${calMonat}-${pad(day)}`;
    const dateObj = new Date(year, mon-1, day);
    const dow = dateObj.getDay();
    const isWochenende = (dow === 0 || dow === 6);
    
    const entryKey = `${adminSelMa}_${ds}`;
    const entry = calendarEntries[entryKey];
    
    let tagHtml = '';
    let infoHtml = '';

    if (!isWochenende) sollStundenGesamt += user.sollTag;

    if (entry) {
      const typeDef = abwesenheitstypen.find(t=>t.id===entry.type);
      if (typeDef) {
        tagHtml = `<span class="tag-custom" style="background:${typeDef.bg};color:${typeDef.color};border:1px solid ${typeDef.border}">${typeDef.emoji} ${esc(typeDef.name)}</span>`;
        
        abwesenheitenCount[typeDef.id] = (abwesenheitenCount[typeDef.id] || 0) + 1;

        if (typeDef.isArbeitszeit) {
          const ein = entry.ein || '08:00';
          const aus = entry.aus || '16:30';
          const pause = (entry.pauseMin || 30) / 60;
          const [h1, m1] = ein.split(':').map(Number);
          const [h2, m2] = aus.split(':').map(Number);
          const netto = Math.max(0, (h2 + m2/60) - (h1 + m1/60) - pause);
          
          istStundenGesamt += netto;
          infoHtml = `<div class="cal-time">${ein}–${aus}<br>${fmtH(netto)}</div>`;
        }
      }
    } else if (!isWochenende) {
      tagHtml = `<span class="tag-custom" style="background:var(--surface2);color:var(--text3)">Anwesend</span>`;
      istStundenGesamt += user.sollTag;
      infoHtml = `<div class="cal-time">08:00–16:30<br>8h 00m</div>`;
    }

    cells += `<div class="cal-day" onclick="openAbwesenheitModal('${ds}')">
      <div class="cal-dn" style="${isWochenende?'color:var(--text3)':''}">${day}</div>
      ${tagHtml}
      ${infoHtml}
    </div>`;
  }

  const maChips = users.map(u => 
    `<div class="ma-chip ${adminSelMa===u.id?'act':''}" onclick="adminSelMa='${u.id}';render()">${esc(u.name)}</div>`
  ).join('');

  const saldo = istStundenGesamt - sollStundenGesamt;

  return `
    <div class="page-hd">
      <h1>📅 Kalender & Abwesenheiten — ${esc(user.name)}</h1>
    </div>
    <div class="ma-chips">${maChips}</div>

    <div class="cal-nav">
      <h2>August 2026</h2>
      <div style="margin-left:auto;font-size:12px;color:var(--text2)">Klicke auf einen Tag, um Abwesenheiten oder Zeiterfassung zu bearbeiten</div>
    </div>

    <div class="cal-legend">
      ${abwesenheitstypen.map(t=>`
        <span><span class="leg-dot" style="background:${t.bg};border:1px solid ${t.border}"></span>${t.emoji} ${esc(t.name)} ${t.isArbeitszeit?'<small>(Arbeitszeit)</small>':''}</span>
      `).join('')}
    </div>

    <div class="cal-grid">
      <div class="cal-head">Mo</div><div class="cal-head">Di</div><div class="cal-head">Mi</div>
      <div class="cal-head">Do</div><div class="cal-head">Fr</div><div class="cal-head">Sa</div><div class="cal-head">So</div>
      ${cells}
    </div>

    <div class="sep"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="stat-card" style="min-width:130px"><div class="stat-lbl">Ist-Arbeitszeit</div><div class="stat-val" style="font-size:18px">${fmtH(istStundenGesamt)}</div></div>
      <div class="stat-card" style="min-width:130px"><div class="stat-lbl">Soll-Arbeitszeit</div><div class="stat-val" style="font-size:18px">${fmtH(sollStundenGesamt)}</div></div>
      <div class="stat-card" style="min-width:130px"><div class="stat-lbl">Saldo</div><div class="stat-val ${saldo>=0?'pos':'neg'}" style="font-size:18px">${saldo>=0?'+':''}${fmtH(saldo)}</div></div>
      ${abwesenheitstypen.map(t=>{
        const cnt = abwesenheitenCount[t.id] || 0;
        return cnt > 0 ? `<div class="stat-card" style="min-width:110px"><div class="stat-lbl">${t.emoji} ${esc(t.name)}</div><div class="stat-val" style="font-size:18px">${cnt} Tage</div></div>` : '';
      }).join('')}
    </div>
  `;
}

// ── Abwesenheit Modal ──
function openAbwesenheitModal(dateStr){
  const user = users.find(u=>u.id===adminSelMa);
  const entryKey = `${adminSelMa}_${dateStr}`;
  const entry = calendarEntries[entryKey] || {};
  const currentType = entry.type || '';

  const opts = abwesenheitstypen.map(t=>`
    <option value="${t.id}" ${currentType===t.id?'selected':''}>${t.emoji} ${esc(t.name)} ${t.isArbeitszeit?'(Arbeitszeit)':''}</option>
  `).join('');

  const typeDef = abwesenheitstypen.find(t=>t.id===(currentType || abwesenheitstypen[0].id));
  const showTimes = typeDef ? typeDef.isArbeitszeit : false;

  openModal(`
    <h3>📅 Abwesenheit eintragen — ${dateStr.split('-').reverse().join('.')}</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:14px">Mitarbeiter: <strong>${esc(user.name)}</strong></p>
    
    <div class="form-row">
      <label class="form-lbl">Abwesenheits-Typ</label>
      <select id="m-typ" class="form-inp" onchange="toggleModalTimes()">
        <option value="">-- Keine Abwesenheit (Normal) --</option>
        ${opts}
      </select>
    </div>

    <div id="modal-time-fields" style="display:${showTimes?'block':'none'}">
      <div class="form-row"><label class="form-lbl">Kommen</label><input type="time" id="m-ein" class="form-inp" value="${entry.ein||'08:00'}"></div>
      <div class="form-row"><label class="form-lbl">Gehen</label><input type="time" id="m-aus" class="form-inp" value="${entry.aus||'16:30'}"></div>
      <div class="form-row"><label class="form-lbl">Pause (Min.)</label><input type="number" id="m-pause" class="form-inp" value="${entry.pauseMin||30}"></div>
    </div>

    <div class="form-row">
      <label class="form-lbl">Bemerkung</label>
      <input type="text" id="m-kommentar" class="form-inp" placeholder="z. B. Nachweis liegt vor" value="${esc(entry.kommentar||'')}">
    </div>

    <div class="modal-actions">
      ${currentType ? `<button class="btn btn-danger" onclick="deleteEntry('${dateStr}')">🗑 Entfernen</button>` : ''}
      <button class="btn" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveEntry('${dateStr}')">💾 Speichern</button>
    </div>
  `);
}

function toggleModalTimes(){
  const typId = document.getElementById('m-typ').value;
  const typeDef = abwesenheitstypen.find(t=>t.id===typId);
  const container = document.getElementById('modal-time-fields');
  if (container) {
    container.style.display = (typeDef && typeDef.isArbeitszeit) ? 'block' : 'none';
  }
}

function saveEntry(dateStr){
  const typId = document.getElementById('m-typ').value;
  const entryKey = `${adminSelMa}_${dateStr}`;

  if (!typId) {
    delete calendarEntries[entryKey];
  } else {
    const typeDef = abwesenheitstypen.find(t=>t.id===typId);
    calendarEntries[entryKey] = {
      type: typId,
      kommentar: document.getElementById('m-kommentar').value,
      ein: typeDef.isArbeitszeit ? document.getElementById('m-ein').value : null,
      aus: typeDef.isArbeitszeit ? document.getElementById('m-aus').value : null,
      pauseMin: typeDef.isArbeitszeit ? +document.getElementById('m-pause').value : 0
    };
  }

  closeModal();
  render();
}

function deleteEntry(dateStr){
  delete calendarEntries[`${adminSelMa}_${dateStr}`];
  closeModal();
  render();
}

// ── Einstellungen View ──
function renderEinstellungen(){
  return `
    <div class="page-hd">
      <h1>⚙️ Abwesenheitstypen verwalten</h1>
      <button class="btn btn-primary" onclick="openAddTypeModal()">➕ Neuer Abwesenheitstyp</button>
    </div>

    <div class="alert alert-info">
      Hier definieren Sie die Abwesenheitsarten für Ihr Unternehmen. Sie legen fest, ob ein Typ als gearbeitete Zeit (z. B. Geschäftsreise, Homeoffice) in das Stundenkonto einfließt oder als freigestellte Zeit gewertet wird.
    </div>

    <div class="card">
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Emoji</th>
              <th>Name</th>
              <th>ID</th>
              <th>Zählt als Arbeitszeit?</th>
              <th>Farbe</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody>
            ${abwesenheitstypen.map(t=>`
              <tr>
                <td style="font-size:18px">${t.emoji}</td>
                <td><strong>${esc(t.name)}</strong></td>
                <td><code>${esc(t.id)}</code></td>
                <td>
                  ${t.isArbeitszeit 
                    ? '<span class="pill pill-ok">Ja (Arbeitszeit)</span>' 
                    : '<span class="pill" style="background:var(--bg);color:var(--text2)">Nein (Keine Arbeitszeit)</span>'}
                </td>
                <td><span class="tag-custom" style="background:${t.bg};color:${t.color};border:1px solid ${t.border}">${t.emoji} ${esc(t.name)}</span></td>
                <td>
                  ${!t.isPreset 
                    ? `<button class="btn btn-sm btn-danger" onclick="removeType('${t.id}')">Löschen</button>` 
                    : '<span style="font-size:11px;color:var(--text3)">Standard</span>'}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function openAddTypeModal(){
  openModal(`
    <h3>➕ Neuen Abwesenheitstyp anlegen</h3>
    <div class="form-row">
      <label class="form-lbl">ID (z. B. fortbildung)</label>
      <input type="text" id="t-id" class="form-inp" placeholder="fortbildung">
    </div>
    <div class="form-row">
      <label class="form-lbl">Name</label>
      <input type="text" id="t-name" class="form-inp" placeholder="Fortbildung / Seminar">
    </div>
    <div class="form-row">
      <label class="form-lbl">Emoji</label>
      <input type="text" id="t-emoji" class="form-inp" value="🎓">
    </div>
    <div class="form-row">
      <label class="form-lbl">Zählt als Arbeitszeit</label>
      <select id="t-arbeitszeit" class="form-inp">
        <option value="true">Ja (wird mit Soll/Zeiterfassung verrechnet)</option>
        <option value="false" selected>Nein (Keine Arbeitszeit)</option>
      </select>
    </div>
    <div class="form-row">
      <label class="form-lbl">Farbe (Hex)</label>
      <input type="color" id="t-color" class="form-inp" value="#2563eb" style="height:32px;padding:2px">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveNewType()">Anlegen</button>
    </div>
  `);
}

function saveNewType(){
  const id = document.getElementById('t-id').value.trim().toLowerCase().replace(/\s+/g, '_');
  const name = document.getElementById('t-name').value.trim();
  const emoji = document.getElementById('t-emoji').value.trim() || '📌';
  const isArbeitszeit = document.getElementById('t-arbeitszeit').value === 'true';
  const color = document.getElementById('t-color').value;

  if (!id || !name) { alert('Bitte ID und Namen eingeben.'); return; }
  if (abwesenheitstypen.some(t=>t.id===id)) { alert('Eine Abwesenheitsart mit dieser ID existiert bereits.'); return; }

  abwesenheitstypen.push({
    id, name, emoji, color,
    bg: color + '15',
    border: color + '40',
    isArbeitszeit,
    isPreset: false
  });

  closeModal();
  render();
}

function removeType(id){
  if (!confirm('Diesen Abwesenheitstyp wirklich löschen?')) return;
  abwesenheitstypen = abwesenheitstypen.filter(t=>t.id!==id);
  render();
}

function openModal(html){
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-bg').style.display = 'flex';
}
function closeModal(){
  document.getElementById('modal-bg').style.display = 'none';
}

// Initial render
render();
</script>
</body>
</html>
